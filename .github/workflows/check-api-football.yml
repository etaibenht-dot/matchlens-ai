name: Check API-Football connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm secret is available
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY is empty or unavailable"
            exit 1
          fi

          echo "API_FOOTBALL_KEY is available"
          echo "Key length: ${#API_FOOTBALL_KEY}"

      - name: Verify API connection and Ligat Ha'al coverage
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m src.check_api_football
